name: validate

on:
  pull_request:

jobs:
  check:
    runs-on: rotfront-node
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: https://github.com/pnpm/action-setup@v6
        with:
          version: 10
      - run: pnpm i && pnpm --package=typescript dlx tsc --noEmit
