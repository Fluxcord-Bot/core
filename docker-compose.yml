services:
  bot:
    build:
      context: .
      dockerfile: "./Dockerfile"
      tags:
        - "fluxcord:latest"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "./data:/data"
      - "./config.js:/app/config.js"
    restart: unless-stopped
    # ports:
    #   - "8765:8765"
    #   - "8080:8080" # healthcheck endpoint (/health), uncomment to scrape from host
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - fluxcord-net

networks:
  fluxcord-net:
    driver: bridge
    name: fluxcord-net
